name: Apply refactor patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/temp-source-export-2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-friendly-metadata-api
          fetch-depth: 0

      - name: Apply reviewed source patch
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/aero-refactor.patch
          git apply --index /tmp/aero-refactor.patch

      - name: Commit reviewed refactor
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "refactor: simplify routed events and metadata declarations [skip ci]"
          git push origin HEAD:agent/developer-friendly-metadata-api
