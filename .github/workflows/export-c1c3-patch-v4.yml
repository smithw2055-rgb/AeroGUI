name: Export C1-C3 Patch v4

on:
  pull_request:
    branches:
      - codex/local-no-samples-tests
    types: [synchronize]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/c1-c3-closure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c1-c3-closure
          fetch-depth: 0
      - name: Recover unique gzip stream
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin agent/c1-c3-payload-v3:refs/remotes/origin/agent/c1-c3-payload-v3
          for n in 01 02 03 04 05 06 07 08; do
            git show origin/agent/c1-c3-payload-v3:.c1c3/v3-part-$n > /tmp/raw-$n
          done
          head -c 8192 .c1c3/v3-part-00 > /tmp/part-00
          python3 - <<'PY'
          import base64, zlib
          from pathlib import Path

          def b64win(raw, off):
              return base64.b64decode(raw[off:off+8192], validate=True)
          def dec_full(raw):
              return base64.b64decode(raw, validate=True)
          def textual(b):
              if not b: return False
              try: s=b.decode('utf-8')
              except UnicodeDecodeError: return False
              printable=sum(c=='\n' or c=='\r' or c=='\t' or 32<=ord(c)<127 for c in s)
              return printable/len(s) > 0.985 and ('diff --git ' in s or '@@ ' in s)

          p0=Path('/tmp/part-00').read_bytes()
          raw={n:Path(f'/tmp/raw-{n:02d}').read_bytes() for n in range(1,9)}
          fixed_dec={n:dec_full(raw[n]) for n in (2,3,4,6,7,8)}
          d0=zlib.decompressobj(31)
          d0.decompress(dec_full(p0))

          c1=[]
          for off in range(0,len(raw[1])-8192+1,4):
              try:
                  st=d0.copy(); out=bytearray()
                  out += st.decompress(b64win(raw[1],off))
                  for n in (2,3,4): out += st.decompress(fixed_dec[n])
                  if textual(bytes(out)):
                      c1.append((off,st))
              except Exception:
                  pass
          print('textual part01 candidates', [o for o,_ in c1])
          found=[]
          decoded5=[]
          for off5 in range(0,len(raw[5])-8192+1,4):
              try: decoded5.append((off5,b64win(raw[5],off5)))
              except Exception: pass
          for off1,st1 in c1:
              for off5,d5 in decoded5:
                  try:
                      st=st1.copy(); out=bytearray()
                      out += st.decompress(d5)
                      for n in (6,7,8): out += st.decompress(fixed_dec[n])
                      out += st.flush()
                      if st.eof and textual(bytes(out)):
                          found.append((off1,off5))
                  except Exception:
                      pass
          print('complete candidates', found)
          if len(found)!=1:
              raise SystemExit(f'expected one complete candidate, got {found}')
          off1,off5=found[0]
          Path('/tmp/part-01').write_bytes(raw[1][off1:off1+8192])
          Path('/tmp/part-05').write_bytes(raw[5][off5:off5+8192])
          print('selected',off1,off5)
          PY
          cp /tmp/raw-02 /tmp/part-02
          cp /tmp/raw-03 /tmp/part-03
          cp /tmp/raw-04 /tmp/part-04
          cp /tmp/raw-06 /tmp/part-06
          cp /tmp/raw-07 /tmp/part-07
          cp /tmp/raw-08 /tmp/part-08
          cat /tmp/part-00 /tmp/part-01 /tmp/part-02 /tmp/part-03 /tmp/part-04 /tmp/part-05 /tmp/part-06 /tmp/part-07 /tmp/part-08 > /tmp/c1c3.patch.b64
          test "$(wc -c < /tmp/c1c3.patch.b64)" -eq 66980
          echo 'a72853743fd4ab3883f1ec2da85df4c0e4cfa6b3fdf9bfd387e9336cc1ec5842  /tmp/c1c3.patch.b64' | sha256sum -c -
          base64 -d /tmp/c1c3.patch.b64 > /tmp/c1c3.patch.gz
          echo '242c38e1f7d1b6e2282159eb1cc0f9e2695264b55bf5a3586ee1998dfbaf54ba  /tmp/c1c3.patch.gz' | sha256sum -c -
          gzip -dc /tmp/c1c3.patch.gz > AeroGUI-C1-C3-final.patch
          echo '3b4cfdb9b5a013eeff9f91b21e779b4505269d2c0d680aac7ca1a5267fa183dc  AeroGUI-C1-C3-final.patch' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: AeroGUI-C1-C3-final-patch
          path: AeroGUI-C1-C3-final.patch
          retention-days: 1
