name: Recover Refactor Patch

on:
  pull_request:
    branches:
      - codex/local-no-samples-tests
  push:
    branches:
      - agent/remove-presentation-layer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover best staged versions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovered versions
          for index in $(seq -w 0 12); do
            path=".github/refactor-patch/part-${index}"
            : > "versions/part-${index}.txt"
            best_commit=""
            best_size=0
            while read -r commit; do
              [ -n "$commit" ] || continue
              if git cat-file -e "$commit:$path" 2>/dev/null; then
                size=$(git cat-file -s "$commit:$path")
                printf '%s %s\n' "$commit" "$size" >> "versions/part-${index}.txt"
                expected=16000
                [ "$index" = "12" ] && expected=5668
                if [ "$size" -eq "$expected" ]; then
                  best_commit="$commit"
                  best_size="$size"
                  break
                fi
                if [ "$size" -gt "$best_size" ]; then
                  best_commit="$commit"
                  best_size="$size"
                fi
              fi
            done < <(git log --all --format=%H -- "$path")
            if [ -n "$best_commit" ]; then
              git show "$best_commit:$path" > "recovered/part-${index}"
              printf 'part-%s <- %s (%s bytes)\n' "$index" "$best_commit" "$best_size"
            else
              printf 'part-%s: no historical version\n' "$index"
            fi
          done
          find recovered -type f -printf '%f %s bytes\n' | sort
      - name: Attempt patch reconstruction
        shell: bash
        run: |
          set -u
          cat recovered/part-* | tr -d '\r\n\t ' > recovered.patch.b64
          base64 --decode recovered.patch.b64 > recovered.patch.gz || true
          gzip --decompress --stdout recovered.patch.gz > recovered.patch || true
          wc -c recovered.patch.b64 recovered.patch.gz recovered.patch
          gzip --test recovered.patch.gz || true
          git apply --stat recovered.patch || true
          git apply --check recovered.patch || true
          sha256sum recovered.patch > recovered.patch.sha256
      - name: Upload recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: presentation-removal-history-recovery
          path: |
            recovered
            versions
            recovered.patch
            recovered.patch.b64
            recovered.patch.gz
            recovered.patch.sha256
          if-no-files-found: error
          retention-days: 1
