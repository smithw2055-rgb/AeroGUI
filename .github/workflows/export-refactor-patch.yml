name: Export Refactor Patch

on:
  pull_request:
    branches:
      - codex/local-no-samples-tests
  push:
    branches:
      - agent/remove-presentation-layer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Inspect staged patch files
        shell: bash
        run: |
          set -euo pipefail
          find .github/refactor-patch -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
      - name: Upload staged patch directory
        uses: actions/upload-artifact@v4
        with:
          name: presentation-removal-staging
          path: .github/refactor-patch
          if-no-files-found: error
          retention-days: 1
