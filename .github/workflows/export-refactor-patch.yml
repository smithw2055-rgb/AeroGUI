name: Export Refactor Patch

on:
  pull_request:
    branches:
      - codex/local-no-samples-tests
  push:
    branches:
      - agent/remove-presentation-layer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/refactor-patch/part-* | base64 --decode | gzip --decompress > remove-presentation-layer.patch
          git apply --stat remove-presentation-layer.patch
          sha256sum remove-presentation-layer.patch > remove-presentation-layer.patch.sha256
      - name: Upload patch
        uses: actions/upload-artifact@v4
        with:
          name: remove-presentation-layer-patch
          path: |
            remove-presentation-layer.patch
            remove-presentation-layer.patch.sha256
          if-no-files-found: error
          retention-days: 1
