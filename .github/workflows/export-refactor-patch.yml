name: Export Refactor Patch

on:
  pull_request:
    branches:
      - codex/local-no-samples-tests
  push:
    branches:
      - agent/remove-presentation-layer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble patch
        id: assemble
        shell: bash
        run: |
          set -u
          cat \
            .github/refactor-patch/part-00 \
            .github/refactor-patch/part-01 \
            .github/refactor-patch/part-02 \
            .github/refactor-patch/part-03 \
            | tr -d '\r\n\t ' \
            > remove-presentation-layer.patch.b64
          base64 --decode remove-presentation-layer.patch.b64 \
            > remove-presentation-layer.patch.gz || true
          gzip --decompress --stdout remove-presentation-layer.patch.gz \
            > remove-presentation-layer.patch || true
          wc -c remove-presentation-layer.patch.b64 \
                remove-presentation-layer.patch.gz \
                remove-presentation-layer.patch
          git apply --stat remove-presentation-layer.patch || true
          sha256sum remove-presentation-layer.patch > remove-presentation-layer.patch.sha256
          git apply --check remove-presentation-layer.patch
      - name: Upload patch
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remove-presentation-layer-patch
          path: |
            remove-presentation-layer.patch
            remove-presentation-layer.patch.sha256
            remove-presentation-layer.patch.gz
            remove-presentation-layer.patch.b64
          if-no-files-found: error
          retention-days: 1
