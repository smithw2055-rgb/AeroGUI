name: Export Base Source

on:
  pull_request:
    branches:
      - codex/local-no-samples-tests
  push:
    branches:
      - agent/remove-presentation-layer
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/local-no-samples-tests
          submodules: false
      - name: Record base revision
        run: git rev-parse HEAD > AERO_BASE_SHA.txt
      - name: Upload base source
        uses: actions/upload-artifact@v4
        with:
          name: aero-local-no-samples-base-source
          path: |
            .
            !.git
            !out
            !third_party/expat
            !third_party/freetype
            !third_party/harfbuzz
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
