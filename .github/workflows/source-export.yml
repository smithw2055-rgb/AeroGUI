name: Apply Registration Value Migration

on:
  push:
    branches:
      - agent/unified-metadata-control-extensibility

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply verified migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')

          def read(p): return (root / p).read_text()
          def write(p, s): (root / p).write_text(s)
          def replace_once(s, old, new, label):
              count = s.count(old)
              if count != 1:
                  raise RuntimeError(f'{label}: expected 1 occurrence, found {count}')
              return s.replace(old, new, 1)

          for p in ['src/core/Controls.cpp', 'src/core/Layout.cpp']:
              s = read(p)
              s = s.replace(
                  'PropertyRegistry().Types().TryCreateValue(',
                  'MetadataRegistrationValues(PropertyRegistry().Types()).TryCreateValue(')
              write(p, s)

          p = 'src/core/Presentation.cpp'
          s = read(p)
          s = s.replace(
              'return types->TryCreateValue(type, &length);',
              'return MetadataRegistrationValues(*types).TryCreateValue(type, &length);')
          s = s.replace(
              'return static_cast<TypeRegistry*>(context)->TryCreateValue(\n        type, &parsed.Value());',
              'return MetadataRegistrationValues(\n        *static_cast<TypeRegistry*>(context)).TryCreateValue(\n            type, &parsed.Value());')
          s = s.replace(
              'return static_cast<TypeRegistry*>(context)->TryCreateValue(\n        type, &color);',
              'return MetadataRegistrationValues(\n        *static_cast<TypeRegistry*>(context)).TryCreateValue(type, &color);')
          s = s.replace('context.types.TryCreateValue(', 'context.Values().TryCreateValue(')
          needle = '''    status = types.TryRegisterValueSemantics(BuiltinTypes::Length,
              {sizeof(Length), alignof(Length), nullptr, nullptr,
               &EqualLength, nullptr, true});'''
          repl = '''    MetadataRegistrationValues values(types);
              status = values.TryRegisterValueSemantics(BuiltinTypes::Length,
                  {sizeof(Length), alignof(Length), nullptr, nullptr,
                   &EqualLength, nullptr, true});'''
          s = replace_once(s, needle, repl, 'presentation service declaration')
          s = s.replace('types.TryRegisterValueSemantics(', 'values.TryRegisterValueSemantics(')
          s = s.replace('types.TryRegisterTextConverter(converter)', 'values.TryRegisterTextConverter(converter)')
          write(p, s)

          p = 'src/markup/XamlSchemaContext.cpp'
          s = read(p)
          s = replace_once(
              s,
              '#include <Aero/Markup/XamlSchemaContext.hpp>\n',
              '#include <Aero/Markup/XamlSchemaContext.hpp>\n\n#include <Aero/Core/MetadataRegistrationValues.hpp>\n',
              'xaml include')
          s = replace_once(
              s,
              'Base::Result<Core::Value> reflected = types_->TryConvertText(type, text);',
              'Base::Result<Core::Value> reflected =\n        Core::MetadataRegistrationValues(*types_).TryConvertText(type, text);',
              'xaml conversion')
          write(p, s)

          p = 'tests/unit/TypeRegistryTests.cpp'
          s = read(p)
          s = replace_once(
              s,
              '#include <Aero/Core/TypeRegistry.hpp>\n',
              '#include <Aero/Core/TypeRegistry.hpp>\n#include <Aero/Core/MetadataRegistrationValues.hpp>\n',
              'registry test include')
          s = s.replace(
              'return registry->TryCreateValue(type, &value);',
              'return MetadataRegistrationValues(*registry).TryCreateValue(type, &value);')
          insert = '''    CHECK(registry.TryRegisterType({ns, StringView("Object"), InvalidTypeId,
              TypeFlags::None, nullptr}));
              MetadataRegistrationValues values(registry);'''
          s = replace_once(
              s,
              '''    CHECK(registry.TryRegisterType({ns, StringView("Object"), InvalidTypeId,
              TypeFlags::None, nullptr}));''',
              insert,
              'registry test values declaration')
          s = s.replace('registry.TryRegisterValueSemantics(', 'values.TryRegisterValueSemantics(')
          s = s.replace('registry.TryRegisterTextConverter(', 'values.TryRegisterTextConverter(')
          s = s.replace('registry.TryCreateValue(', 'values.TryCreateValue(')
          s = s.replace('registry.TryConvertText(', 'values.TryConvertText(')
          s = s.replace(
              'Unified Value and registry semantics',
              'Unified Value and registration service semantics')
          write(p, s)

          p = 'tests/unit/XamlCustomControlTests.cpp'
          s = read(p)
          s = replace_once(
              s,
              '#include <Aero/Core/MetadataRuntime.hpp>\n',
              '#include <Aero/Core/MetadataRuntime.hpp>\n#include <Aero/Core/MetadataRegistrationValues.hpp>\n',
              'custom test include')
          s = s.replace(
              'return types->TryCreateValue(type, &radius);',
              'return MetadataRegistrationValues(*types).TryCreateValue(type, &radius);')
          s = s.replace('context.types.TryCreateValue(', 'context.Values().TryCreateValue(')
          needle = '''    Result<void> status = context.types.TryRegisterValueSemantics(
              cornerRadiusType,
              {sizeof(CornerRadius), alignof(CornerRadius), nullptr, nullptr,
               &EqualCornerRadius, nullptr, true});'''
          repl = '''    MetadataRegistrationValues values = context.Values();
              Result<void> status = values.TryRegisterValueSemantics(
                  cornerRadiusType,
                  {sizeof(CornerRadius), alignof(CornerRadius), nullptr, nullptr,
                   &EqualCornerRadius, nullptr, true});'''
          s = replace_once(s, needle, repl, 'custom registration values')
          s = s.replace(
              'status = context.types.TryRegisterTextConverter(',
              'status = values.TryRegisterTextConverter(')
          write(p, s)

          p = 'include/Aero/Core/TypeRegistry.hpp'
          s = read(p)
          s = replace_once(
              s,
              'class MetaRegistrationBuilder;\n',
              'class MetaRegistrationBuilder;\nclass MetadataRegistrationValues;\n',
              'service forward declaration')
          public_block = '''    Base::Result<void> TryRegisterValueSemantics(
              TypeId type,
              const ValueTypeRegistration& registration) noexcept;
              Base::Result<void> TryRegisterTextConverter(
                  const TextValueConverterRegistration& registration) noexcept;
              Base::Result<Value> TryCreateValue(
                  TypeId type,
                  const void* source) const noexcept;
              Base::Result<Value> TryConvertText(
                  TypeId type,
                  Base::StringView text) const noexcept;

          '''
          s = replace_once(s, public_block, '', 'remove public value methods')
          lookup_block = '''    // Seal-time export surface used to transfer value behavior into owned
              // facets. Returned registrations remain immutable after Freeze().
              const Base::Ref<ValueTypeSemantics>* FindValueSemantics(
                  TypeId type) const noexcept;
              const TextValueConverterRegistration* FindTextConverter(
                  TypeId type) const noexcept;

          '''
          s = replace_once(s, lookup_block, '', 'remove public value lookups')
          private_marker = '''private:
              struct MemberLocation final {'''
          private_repl = '''private:
              friend class MetadataRegistrationValues;

              // Storage backend for the explicit registration-domain value service.
              Base::Result<void> TryRegisterValueSemantics(
                  TypeId type,
                  const ValueTypeRegistration& registration) noexcept;
              Base::Result<void> TryRegisterTextConverter(
                  const TextValueConverterRegistration& registration) noexcept;
              const Base::Ref<ValueTypeSemantics>* FindValueSemantics(
                  TypeId type) const noexcept;
              const TextValueConverterRegistration* FindTextConverter(
                  TypeId type) const noexcept;

              struct MemberLocation final {'''
          s = replace_once(s, private_marker, private_repl, 'private value backend')
          write(p, s)

          p = 'src/core/TypeRegistry.cpp'
          s = read(p)
          execution = '''Base::Result<Value> TypeRegistry::TryCreateValue(
              TypeId type,
              const void* source) const noexcept {
              const Base::Ref<ValueTypeSemantics>* semantics = FindValueSemantics(type);
              return semantics != nullptr
                  ? Value::TryFromCustom(type, source, *semantics)
                  : Base::Result<Value>(Base::Status::Failure(
                      Base::ErrorCode::NotFound,
                      "Value type semantics are not registered"));
          }

          Base::Result<Value> TypeRegistry::TryConvertText(
              TypeId type,
              Base::StringView text) const noexcept {
              const TextValueConverterRegistration* entry = FindTextConverter(type);
              if (entry == nullptr) {
                  return Base::Status::Failure(
                      Base::ErrorCode::NotFound,
                      "Text value converter is not registered");
              }
              Base::Result<Value> converted = entry->convert(type, text, entry->context);
              if (converted && converted.Value().Type() != type) {
                  return Base::Status::Failure(
                      Base::ErrorCode::InvalidArgument,
                      "Text converter returned a value with the wrong type");
              }
              return converted;
          }

          '''
          s = replace_once(s, execution, '', 'remove registry execution definitions')
          write(p, s)

          p = '.github/workflows/ci.yml'
          s = read(p)
          export_steps = '''      - name: Package source tree
                  if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
                  shell: bash
                  run: tar --exclude=.git --exclude=out -czf /tmp/aero-source-tree.tar.gz .
                - name: Upload source tree
                  if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
                  uses: actions/upload-artifact@v4
                  with:
                    name: aero-source-tree
                    path: /tmp/aero-source-tree.tar.gz
                    if-no-files-found: error
                    retention-days: 1
          '''
          s = replace_once(s, export_steps, '', 'restore CI')
          write(p, s)

          for p in ['.github/workflows/source-export.yml', '.github/source-export-trigger']:
              path = root / p
              if path.exists():
                  path.unlink()
          PY

          git diff --check
          ! rg -n 'TypeRegistry::Try(CreateValue|ConvertText)' include src tests
          ! rg -n '\.Try(CreateValue|ConvertText)\(' include src tests | grep -v 'MetadataRegistrationValues' | grep -v 'MetadataRuntime' | grep -v 'runtime_'
      - name: Commit migration
        shell: bash
        run: |
          git config user.name "AeroGUI Metadata Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Remove TypeRegistry value execution API"
          git push origin HEAD:agent/unified-metadata-control-extensibility
