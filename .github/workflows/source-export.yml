name: Source Export

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'agent/temp-source-export-2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-friendly-metadata-api
      - uses: actions/upload-artifact@v4
        with:
          name: aero-metadata-refactor-source
          path: .
          include-hidden-files: true
          retention-days: 1
