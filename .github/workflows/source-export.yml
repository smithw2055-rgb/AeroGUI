name: Source Export

on:
  push:
    branches:
      - agent/temp-source-export-2
    paths:
      - .github/workflows/source-export.yml

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-friendly-metadata-api
      - uses: actions/upload-artifact@v4
        with:
          name: aero-metadata-refactor-source
          path: .
          include-hidden-files: true
          retention-days: 1
