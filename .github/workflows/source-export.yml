name: Source Export

on:
  pull_request:
    branches:
      - agent/bootstrap-cxx17-foundation

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: aero-source-tree
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
