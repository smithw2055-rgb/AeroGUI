name: Architecture Closure Auto Merge

on:
  push:
    branches:
      - agent/c1-c3-closure

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-cleanup-merge:
    if: github.event.head_commit.message == 'C1-C3 architecture closure'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout final closure
        uses: actions/checkout@v4
        with:
          ref: agent/c1-c3-closure
          fetch-depth: 0
          submodules: recursive

      - name: Verify final closure surface
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e .c1c3
          test ! -e src/runtime
          test ! -e src/providers
          test ! -e src/platform
          test -f src/gui/Gui.cpp
          test -f src/gui/View.cpp
          test -f src/markup/XamlProvider.cpp
          test -f src/app/platform/Window.hpp
          test -f src/app/platform/WindowWait.cpp
          ! find .github/workflows -maxdepth 1 -name 'c1c3-*' -print -quit | grep -q .
          ! grep -R -E 'RunChecked|ShowChecked|CloseChecked|SetContentChecked' include/Aero
          grep -q 'WaitEventFor' src/app/platform/Window.hpp
          grep -q 'WaitForActivity' src/app/DesktopHost.cpp
          ! grep -q 'sleep_for' src/app/DesktopHost.cpp
          grep -q 'RenderOnscreen' src/render/Renderer.hpp
          ! grep -q 'SubmitFrame' src/render/Surface.hpp
          grep -R -q 'runtime-generated' CMakeLists.txt cmake

      - name: Configure strict final build
        run: >-
          cmake -S . -B build-final -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DAERO_BUILD_TESTS=OFF
          -DAERO_BUILD_SAMPLES=OFF
          -DAERO_BUILD_TOOLS=ON
          -DAERO_ENABLE_EXCEPTIONS=OFF
          -DAERO_ENABLE_RTTI=OFF
          -DAERO_WARNINGS_AS_ERRORS=ON
          -DAERO_ENABLE_D3D11_BACKEND=OFF
          -DAERO_ENABLE_WGL_SURFACE=OFF
          -DAERO_ENABLE_GLX_SURFACE=OFF
          -DAERO_ENABLE_SOKOL_BACKEND=OFF

      - name: Build final closure
        run: cmake --build build-final -j2

      - name: Remove auto-merge workflow
        shell: bash
        run: |
          set -euxo pipefail
          rm -f .github/workflows/architecture-closure-automerge.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'remove architecture closure automation'
          git push origin HEAD:agent/c1-c3-closure

      - name: Mark PR ready and squash merge
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euxo pipefail
          pr=61
          node_id=$(gh api repos/$GH_REPO/pulls/$pr --jq .node_id)
          gh api graphql \
            -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft}}}' \
            -f id="$node_id"
          sha=$(git rev-parse HEAD)
          gh api -X PUT repos/$GH_REPO/pulls/$pr/merge \
            -f sha="$sha" \
            -f merge_method='squash' \
            -f commit_title='C1-C3 final architecture closure' \
            -f commit_message='Complete Gui/XAML/View ownership closure, domain source and CMake flattening, and final SDK surface cleanup.'
