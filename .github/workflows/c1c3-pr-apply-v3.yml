name: Apply C1-C3 Closure via PR v3

on:
  pull_request:
    branches:
      - codex/local-no-samples-tests
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-build-commit:
    if: github.event.pull_request.head.ref == 'agent/c1-c3-closure'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: agent/c1-c3-closure
          fetch-depth: 0
          submodules: recursive

      - name: Rebuild and verify closure patch
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin agent/c1-c3-payload-v3:refs/remotes/origin/agent/c1-c3-payload-v3
          cat .c1c3/v3-part-00 > /tmp/c1c3.patch.b64
          for n in 01 02 03 04 05 06 07 08; do
            git show origin/agent/c1-c3-payload-v3:.c1c3/v3-part-$n >> /tmp/c1c3.patch.b64
          done
          test "$(wc -c < /tmp/c1c3.patch.b64)" -eq 66980
          echo 'a72853743fd4ab3883f1ec2da85df4c0e4cfa6b3fdf9bfd387e9336cc1ec5842  /tmp/c1c3.patch.b64' | sha256sum -c -
          base64 -d /tmp/c1c3.patch.b64 > /tmp/c1c3.patch.gz
          echo '242c38e1f7d1b6e2282159eb1cc0f9e2695264b55bf5a3586ee1998dfbaf54ba  /tmp/c1c3.patch.gz' | sha256sum -c -
          gzip -dc /tmp/c1c3.patch.gz > /tmp/c1c3.patch
          echo '3b4cfdb9b5a013eeff9f91b21e779b4505269d2c0d680aac7ca1a5267fa183dc  /tmp/c1c3.patch' | sha256sum -c -
          git apply --check --3way /tmp/c1c3.patch
          git apply --3way /tmp/c1c3.patch

      - name: Remove staging payload and one-shot workflows
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf .c1c3
          rm -f .github/workflows/c1c3-apply.yml
          rm -f .github/workflows/c1c3-apply-final.yml
          rm -f .github/workflows/c1c3-pr-apply.yml
          rm -f .github/workflows/c1c3-pr-apply-v2.yml
          rm -f .github/workflows/c1c3-pr-apply-v3.yml

      - name: Verify source closure
        shell: bash
        run: |
          set -euxo pipefail
          test ! -e src/runtime
          test ! -e src/providers
          test ! -e src/platform
          test -f src/gui/Gui.cpp
          test -f src/gui/View.cpp
          test -f src/markup/XamlProvider.cpp
          test -f src/app/platform/Window.hpp
          test -f src/app/platform/WindowWait.cpp
          grep -q 'class AERO_API Gui' include/Aero/Gui.hpp
          ! grep -q 'class AERO_API View' include/Aero/Gui.hpp
          grep -q 'class AERO_API View' include/Aero/View.hpp
          ! grep -R -E 'RunChecked|ShowChecked|CloseChecked|SetContentChecked' include/Aero

      - name: Configure strict C++17 build
        run: >-
          cmake -S . -B build-c1c3 -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DAERO_BUILD_TESTS=OFF
          -DAERO_BUILD_SAMPLES=OFF
          -DAERO_BUILD_TOOLS=ON
          -DAERO_ENABLE_EXCEPTIONS=OFF
          -DAERO_ENABLE_RTTI=OFF
          -DAERO_WARNINGS_AS_ERRORS=ON
          -DAERO_ENABLE_D3D11_BACKEND=OFF
          -DAERO_ENABLE_WGL_SURFACE=OFF
          -DAERO_ENABLE_GLX_SURFACE=OFF
          -DAERO_ENABLE_SOKOL_BACKEND=OFF

      - name: Build
        run: cmake --build build-c1c3 -j2

      - name: Commit closure
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git status --short
          git commit -m 'C1-C3 architecture closure'
          git push origin HEAD:agent/c1-c3-closure
