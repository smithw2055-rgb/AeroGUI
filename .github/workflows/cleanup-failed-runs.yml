name: Cleanup failed workflow runs

on:
  workflow_dispatch:
    inputs:
      keep_days:
        description: "Keep failed runs newer than this many days"
        required: false
        default: "30"
      max_deletions:
        description: "Max number of failed runs to delete in one execution"
        required: false
        default: "200"
      dry_run:
        description: "Set to 'true' to print candidates only"
        required: false
        default: "false"
  schedule:
    - cron: "0 3 * * 1"

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old failed workflow runs
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const keepDays = Number("${{ github.event.inputs.keep_days || '30' }}");
            const maxDeletions = Number("${{ github.event.inputs.max_deletions || '200' }}");
            const dryRun = ("${{ github.event.inputs.dry_run || 'false' }}".toLowerCase() === "true");

            const cutoff = new Date(Date.now() - keepDays * 24 * 60 * 60 * 1000).toISOString();
            const allFailedRuns = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner,
                repo,
                status: "completed",
                conclusion: "failure",
                per_page: 100
              },
              (response) => response.data.workflow_runs
            );

            const staleRuns = allFailedRuns
              .filter((run) => new Date(run.created_at) < new Date(cutoff))
              .sort((a, b) => new Date(a.created_at) - new Date(b.created_at));

            core.info(`Found ${staleRuns.length} failed runs older than ${keepDays} days.`);

            if (staleRuns.length === 0) {
              core.info("No runs need deletion.");
              return;
            }

            const targetRuns = staleRuns.slice(0, maxDeletions);
            const toDelete = targetRuns.map((run) => run.id);

            core.startGroup("Candidate runs");
            for (const run of targetRuns) {
              core.info(`${run.id} ${run.name} ${run.html_url} ${run.created_at}`);
            }
            core.endGroup();

            if (dryRun) {
              core.info(`Dry run enabled, skip deleting ${toDelete.length} runs.`);
              return;
            }

            let deleted = 0;
            let failed = 0;
            for (const runId of toDelete) {
              try {
                await github.rest.actions.deleteWorkflowRun({ owner, repo, run_id: runId });
                deleted += 1;
                core.info(`Deleted run ${runId}`);
              } catch (error) {
                failed += 1;
                core.warning(`Delete failed for run ${runId}: ${error.message}`);
              }
            }

            core.info(`Deleted ${deleted} runs; failed to delete ${failed} runs.`);
