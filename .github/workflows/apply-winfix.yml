name: Materialize deferred-resource lifecycle test

on:
  pull_request:
    branches:
      - codex/m3-interactive-controls-text-opengl

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/rhi/D3D11BackendTests.cpp")
          text = path.read_text()
          old = """        CHECK(device.LiveResourceCount() == 0U);
                  CHECK(device.PendingDestroyCount() ==
                      (iteration + 1U) * ResourcesPerIteration);
              }

              CHECK(backend.LiveResourceCount() ==
                  IterationCount * ResourcesPerIteration);
              CHECK(backend.WaitForFence(lastFence));
              Result<std::uint32_t> collected = device.CollectGarbage();
              CHECK(collected);
              CHECK(collected.Value() == IterationCount * ResourcesPerIteration);
          """
          new = """        CHECK(device.LiveResourceCount() == 0U);
                  const std::uint32_t pending = device.PendingDestroyCount();
                  CHECK(pending >= ResourcesPerIteration);
                  CHECK(pending <= (iteration + 1U) * ResourcesPerIteration);
                  CHECK(backend.LiveResourceCount() == pending);
              }

              const std::uint32_t pendingBeforeWait =
                  device.PendingDestroyCount();
              CHECK(pendingBeforeWait >= ResourcesPerIteration);
              CHECK(backend.LiveResourceCount() == pendingBeforeWait);
              CHECK(backend.WaitForFence(lastFence));
              Result<std::uint32_t> collected = device.CollectGarbage();
              CHECK(collected);
              CHECK(collected.Value() == pendingBeforeWait);
          """
          if old not in text:
              raise SystemExit("deferred-resource assertion block was not found")
          path.write_text(text.replace(old, new, 1))
          PY
          git add tests/rhi/D3D11BackendTests.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update deferred resource lifecycle expectations"
          git push origin "HEAD:${{ github.head_ref }}"
