name: Apply Windows include fixes

on:
  push:
    branches:
      - agent/render-backend-winfix-stage

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/render-backend-winfix-stage
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/winfix.patch.gz.b64 | gzip --decompress > /tmp/winfix.patch
          git apply --index /tmp/winfix.patch
          rm -f .github/winfix.patch.gz.b64 .github/workflows/apply-winfix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix D3D11 Windows includes"
          git push origin HEAD:agent/render-backend-winfix-stage
