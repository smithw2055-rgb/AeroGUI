name: Materialize D3D11 surface test fix

on:
  pull_request:
    branches:
      - codex/m3-interactive-controls-text-opengl

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python -c 'from pathlib import Path; p=Path("tests/rhi/D3D11SurfaceTests.cpp"); s=p.read_text(); old="    CHECK(!device.CreateResource(postLossDescriptor));"; new="    CHECK(!device.CreateBuffer(postLossDescriptor.buffer));"; assert old in s; p.write_text(s.replace(old,new,1))'
          git add tests/rhi/D3D11SurfaceTests.cpp
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix D3D11 surface test resource creation"
          git push origin "HEAD:${{ github.head_ref }}"
