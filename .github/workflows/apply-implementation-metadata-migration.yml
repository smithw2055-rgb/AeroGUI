name: Apply implementation metadata migration

on:
  push:
    branches:
      - agent/developer-friendly-metadata-api
    paths:
      - .github/workflows/apply-implementation-metadata-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-friendly-metadata-api
          fetch-depth: 0

      - name: Rewrite implementation metadata access
        shell: bash
        run: |
          cat > /tmp/migrate_impl.py.gz.b64 <<'AERO_MIGRATION'
          
          AERO_MIGRATION
          base64 --decode /tmp/migrate_impl.py.gz.b64 | gzip --decompress > /tmp/migrate_impl.py
          python3 /tmp/migrate_impl.py .

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            include/Aero/Metadata.hpp \
            src/controls/Metadata.cpp \
            src/controls/Scroll.cpp \
            src/controls/Selection.cpp \
            src/controls/TextBox.cpp \
            src/controls/Virtualization.cpp \
            src/presentation/Metadata.cpp
          git diff --cached --quiet && exit 0
          git commit -m "refactor: migrate implementation metadata access [skip ci]"
          git push origin HEAD:agent/developer-friendly-metadata-api
