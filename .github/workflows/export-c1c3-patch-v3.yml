name: Export C1-C3 Patch v3

on:
  pull_request:
    branches:
      - codex/local-no-samples-tests
    types: [synchronize]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.head.ref == 'agent/c1-c3-closure'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/c1-c3-closure
          fetch-depth: 0
      - name: Recover patch by gzip stream validation
        shell: bash
        run: |
          set -euxo pipefail
          git fetch origin agent/c1-c3-payload-v3:refs/remotes/origin/agent/c1-c3-payload-v3
          for n in 01 02 03 04 05 06 07 08; do
            git show origin/agent/c1-c3-payload-v3:.c1c3/v3-part-$n > /tmp/raw-$n
          done
          head -c 8192 .c1c3/v3-part-00 > /tmp/part-00
          python3 - <<'PY'
          import base64, hashlib, zlib
          from pathlib import Path

          def dec(b):
              return base64.b64decode(b, validate=True)

          p0 = Path('/tmp/part-00').read_bytes()
          fixed = {n: Path(f'/tmp/raw-{n:02d}').read_bytes() for n in range(1,9)}
          d0 = zlib.decompressobj(31)
          d0.decompress(dec(p0))

          def candidates(raw, state, next_chunks):
              out=[]
              for off in range(0, len(raw)-8192+1, 4):
                  w=raw[off:off+8192]
                  try:
                      st=state.copy()
                      st.decompress(dec(w))
                      for nxt in next_chunks:
                          st.decompress(dec(nxt))
                      out.append((off,w,st))
                  except Exception:
                      pass
              return out

          c1=candidates(fixed[1], d0, [fixed[2]])
          print('part01 candidates', [x[0] for x in c1])
          if len(c1)!=1:
              raise SystemExit(f'part01 candidates={len(c1)}')
          off1,p1,st1=c1[0]
          Path('/tmp/part-01').write_bytes(p1)
          st= d0.copy(); st.decompress(dec(p1))
          for n in (2,3,4):
              st.decompress(dec(fixed[n]))

          c5=candidates(fixed[5], st, [fixed[6]])
          print('part05 candidates', [x[0] for x in c5])
          if len(c5)!=1:
              raise SystemExit(f'part05 candidates={len(c5)}')
          off5,p5,st5=c5[0]
          Path('/tmp/part-05').write_bytes(p5)
          print('selected offsets', off1, off5)
          PY
          cp /tmp/raw-02 /tmp/part-02
          cp /tmp/raw-03 /tmp/part-03
          cp /tmp/raw-04 /tmp/part-04
          cp /tmp/raw-06 /tmp/part-06
          cp /tmp/raw-07 /tmp/part-07
          cp /tmp/raw-08 /tmp/part-08
          cat /tmp/part-00 /tmp/part-01 /tmp/part-02 /tmp/part-03 /tmp/part-04 /tmp/part-05 /tmp/part-06 /tmp/part-07 /tmp/part-08 > /tmp/c1c3.patch.b64
          test "$(wc -c < /tmp/c1c3.patch.b64)" -eq 66980
          echo 'a72853743fd4ab3883f1ec2da85df4c0e4cfa6b3fdf9bfd387e9336cc1ec5842  /tmp/c1c3.patch.b64' | sha256sum -c -
          base64 -d /tmp/c1c3.patch.b64 > /tmp/c1c3.patch.gz
          echo '242c38e1f7d1b6e2282159eb1cc0f9e2695264b55bf5a3586ee1998dfbaf54ba  /tmp/c1c3.patch.gz' | sha256sum -c -
          gzip -dc /tmp/c1c3.patch.gz > AeroGUI-C1-C3-final.patch
          echo '3b4cfdb9b5a013eeff9f91b21e779b4505269d2c0d680aac7ca1a5267fa183dc  AeroGUI-C1-C3-final.patch' | sha256sum -c -
      - uses: actions/upload-artifact@v4
        with:
          name: AeroGUI-C1-C3-final-patch
          path: AeroGUI-C1-C3-final.patch
          retention-days: 1
