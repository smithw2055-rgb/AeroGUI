name: Apply typed property access migration

on:
  push:
    branches:
      - agent/developer-friendly-metadata-api
    paths:
      - .github/workflows/apply-typed-property-access.yml
      - .github/scripts/migrate_typed_property_access.py

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-friendly-metadata-api
          fetch-depth: 0

      - name: Rewrite typed property access
        run: python3 .github/scripts/migrate_typed_property_access.py

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            include/Aero/Metadata.hpp \
            include/Aero/Presentation/Rendering.hpp \
            src/controls/Buttons.cpp \
            src/controls/Controls.cpp \
            src/presentation/Layout.cpp
          git diff --cached --quiet && exit 0
          git commit -m "api: simplify typed property access"
          git push origin HEAD:agent/developer-friendly-metadata-api
