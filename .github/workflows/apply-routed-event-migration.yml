name: Apply routed event API migration

on:
  push:
    branches:
      - agent/developer-friendly-metadata-api
    paths:
      - .github/workflows/apply-routed-event-migration.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-friendly-metadata-api
          fetch-depth: 0

      - name: Simplify routed event connections
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/routed_event_migration.py
          python3 /tmp/routed_event_migration.py

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            include/Aero/Presentation/Layout.hpp \
            include/Aero/Controls/Buttons.hpp \
            include/Aero/Controls/Scroll.hpp
          git diff --cached --quiet && exit 0
          git commit -m "refactor: simplify routed event connections [skip ci]"
          git push origin HEAD:agent/developer-friendly-metadata-api
