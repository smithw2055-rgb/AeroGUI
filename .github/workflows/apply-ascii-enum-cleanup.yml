name: Apply ASCII and enum metadata cleanup

on:
  push:
    branches:
      - agent/developer-friendly-metadata-api
    paths:
      - .github/workflows/apply-ascii-enum-cleanup.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-friendly-metadata-api
          fetch-depth: 0

      - name: Remove duplicate ASCII and enum converters
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/ascii_cleanup.py
          python3 /tmp/ascii_cleanup.py

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            include/Aero/Base/Ascii.hpp \
            include/Aero/Core/Metadata/MetadataRuntime.hpp \
            src/core/metadata/CoreMetadata.cpp \
            src/controls/Metadata.cpp \
            src/presentation/Metadata.cpp
          git diff --cached --quiet && exit 0
          git commit -m "refactor: centralize ascii and enum conversion [skip ci]"
          git push origin HEAD:agent/developer-friendly-metadata-api
