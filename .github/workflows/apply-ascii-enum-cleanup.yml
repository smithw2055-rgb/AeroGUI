name: Apply ASCII and enum metadata cleanup

on:
  push:
    branches:
      - agent/developer-friendly-metadata-api
    paths:
      - .github/workflows/apply-ascii-enum-cleanup.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-friendly-metadata-api
          fetch-depth: 0

      - name: Remove duplicate ASCII and enum converters
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path('.')
          ascii_header = root / 'include/Aero/Base/Ascii.hpp'
          ascii_header.write_text('''#pragma once

#include <Aero/Base/StringView.hpp>

#include <cstdint>

namespace Aero::Base {

constexpr bool IsAsciiWhitespace(char value) noexcept {
    return value == ' ' || value == '\\t' || value == '\\n' ||
        value == '\\r' || value == '\\f' || value == '\\v';
}

constexpr char ToAsciiLower(char value) noexcept {
    return value >= 'A' && value <= 'Z'
        ? static_cast<char>(value + ('a' - 'A'))
        : value;
}

inline StringView TrimAscii(StringView value) noexcept {
    std::uint32_t begin = 0U;
    std::uint32_t end = value.SizeBytes();
    while (begin < end && IsAsciiWhitespace(value[begin])) ++begin;
    while (end > begin && IsAsciiWhitespace(value[end - 1U])) --end;
    return value.Substr(begin, end - begin);
}

inline bool EqualsAsciiInsensitive(
    StringView left,
    StringView right) noexcept {
    if (left.SizeBytes() != right.SizeBytes()) return false;
    for (std::uint32_t index = 0U;
         index < left.SizeBytes(); ++index) {
        if (ToAsciiLower(left[index]) != ToAsciiLower(right[index])) {
            return false;
        }
    }
    return true;
}

} // namespace Aero::Base
''')

          path = root / 'include/Aero/Core/Metadata/MetadataRuntime.hpp'
          text = path.read_text()
          text = text.replace('#include <Aero/Base/Config.hpp>\n', '#include <Aero/Base/Ascii.hpp>\n#include <Aero/Base/Config.hpp>\n')
          text = text.replace('\n#include <cctype>\n', '\n')
          begin = text.index('    static Base::StringView Trim(')
          end = text.index('    Base::Result<Value> TryConvertEnumText', begin)
          text = text[:begin] + text[end:]
          text = text.replace('Base::StringView remaining = Trim(input);', 'Base::StringView remaining = Base::TrimAscii(input);')
          text = text.replace('const Base::StringView token = Trim(remaining.Substr(0U, split));', 'const Base::StringView token = Base::TrimAscii(remaining.Substr(0U, split));')
          text = text.replace('EqualsAsciiInsensitive(token, candidate->Name())', 'Base::EqualsAsciiInsensitive(token, candidate->Name())')
          text = text.replace('remaining = Trim(remaining.Substr(split + 1U));', 'remaining = Base::TrimAscii(remaining.Substr(split + 1U));')
          path.write_text(text)

          path = root / 'src/core/metadata/CoreMetadata.cpp'
          text = path.read_text()
          text = text.replace('#include <Aero/Core/Metadata/CoreMetadata.hpp>\n', '#include <Aero/Core/Metadata/CoreMetadata.hpp>\n\n#include <Aero/Base/Ascii.hpp>\n')
          text = text.replace('\n#include <cctype>\n', '\n')
          begin = text.index('bool EqualsAsciiInsensitive(')
          end = text.index('Base::Result<double> ParseDouble', begin)
          text = text[:begin] + text[end:]
          text = text.replace('Trim(text)', 'Base::TrimAscii(text)')
          text = text.replace('EqualsAsciiInsensitive(value, "true")', 'Base::EqualsAsciiInsensitive(value, "true")')
          text = text.replace('EqualsAsciiInsensitive(value, "false")', 'Base::EqualsAsciiInsensitive(value, "false")')
          path.write_text(text)

          path = root / 'src/controls/Metadata.cpp'
          text = path.read_text()
          text = text.replace('\n#include <cctype>\n', '\n')
          begin = text.index('bool EqualsAsciiInsensitive(')
          end = text.index('bool ValidateNonnegativeDouble', begin)
          text = text[:begin] + text[end:]
          text = text.replace('\n        .EnumValue("Vertical", Orientation::Vertical)\n        .TextConverter(&ConvertOrientation);', '\n        .EnumValue("Vertical", Orientation::Vertical);')
          text = text.replace('\n        .EnumValue("Hover", ClickMode::Hover)\n        .TextConverter(&ConvertClickMode);', '\n        .EnumValue("Hover", ClickMode::Hover);')
          text = text.replace('\n        .EnumValue("Extended", SelectionMode::Extended)\n        .TextConverter(&ConvertSelectionMode);', '\n        .EnumValue("Extended", SelectionMode::Extended);')
          path.write_text(text)

          path = root / 'src/presentation/Metadata.cpp'
          text = path.read_text()
          text = text.replace('#include <Aero/Presentation/Metadata.hpp>\n', '#include <Aero/Presentation/Metadata.hpp>\n\n#include <Aero/Base/Ascii.hpp>\n')
          begin = text.index('bool EqualsAsciiInsensitive(')
          end = text.index('Base::Result<double> ParseDouble', begin)
          text = text[:begin] + text[end:]
          text = text.replace('Trim(text)', 'Base::TrimAscii(text)')
          text = text.replace('EqualsAsciiInsensitive(value, "auto")', 'Base::EqualsAsciiInsensitive(value, "auto")')
          begin = text.index('Base::Result<Value> ConvertHorizontal(')
          end = text.index('bool ValidateLength', begin)
          text = text[:begin] + text[end:]
          text = text.replace('\n        .EnumValue("Right", HorizontalAlignment::Right)\n        .TextConverter(&ConvertHorizontal);', '\n        .EnumValue("Right", HorizontalAlignment::Right);')
          text = text.replace('\n        .EnumValue("Bottom", VerticalAlignment::Bottom)\n        .TextConverter(&ConvertVertical);', '\n        .EnumValue("Bottom", VerticalAlignment::Bottom);')
          path.write_text(text)
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            include/Aero/Base/Ascii.hpp \
            include/Aero/Core/Metadata/MetadataRuntime.hpp \
            src/core/metadata/CoreMetadata.cpp \
            src/controls/Metadata.cpp \
            src/presentation/Metadata.cpp
          git diff --cached --quiet && exit 0
          git commit -m "refactor: centralize ascii and enum conversion [skip ci]"
          git push origin HEAD:agent/developer-friendly-metadata-api
