name: C++17 CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.compiler }}, ${{ matrix.build_type }}, shared=${{ matrix.shared }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            build_type: Debug
            shared: OFF
            sanitizer: OFF
          - compiler: gcc
            build_type: Release
            shared: ON
            sanitizer: OFF
          - compiler: clang
            build_type: Debug
            shared: OFF
            sanitizer: ON
    steps:
      - uses: actions/checkout@v4
      - name: Package source tree
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        shell: bash
        run: tar --exclude=.git --exclude=out -czf /tmp/aero-source-tree.tar.gz .
      - name: Upload source tree
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: aero-source-tree
          path: /tmp/aero-source-tree.tar.gz
          if-no-files-found: error
          retention-days: 1
      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        shell: bash
        run: |
          sanitizer_flags=()
          if [[ "${{ matrix.sanitizer }}" == "ON" ]]; then
            sanitizer_flags+=(
              "-DCMAKE_C_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
              "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-omit-frame-pointer"
              "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address,undefined"
              "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address,undefined")
          fi
          cmake -S . -B out/build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DAERO_BUILD_SHARED=${{ matrix.shared }} \
            -DAERO_BUILD_TESTS=ON \
            -DAERO_ENABLE_EXCEPTIONS=OFF \
            -DAERO_ENABLE_RTTI=OFF \
            -DAERO_WARNINGS_AS_ERRORS=ON \
            -DAERO_ENABLE_D3D11_BACKEND=OFF \
            "${sanitizer_flags[@]}"
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build out/build --parallel 2>&1 | tee "out/${{ matrix.compiler }}-build.log"
      - name: Upload Linux build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.compiler }}-build-log
          path: out/${{ matrix.compiler }}-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          ctest --test-dir out/build --output-on-failure 2>&1 | \
            tee "out/${{ matrix.compiler }}-${{ matrix.build_type }}-test.log"
      - name: Upload Linux test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.compiler }}-${{ matrix.build_type }}-test-log
          path: out/${{ matrix.compiler }}-${{ matrix.build_type }}-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Public header C++17 self-containment
        if: matrix.compiler == 'gcc' && matrix.build_type == 'Debug'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r header; do
            printf '#include <%s>\n' "${header#include/}" | \
              "$CXX" -std=c++17 -Iinclude -fsyntax-only -x c++ -
          done < <(find include/Aero -name '*.hpp' -type f | sort)
          printf '#include <Aero/CAPI.h>\n' | \
            "$CC" -std=c11 -Iinclude -fsyntax-only -x c -

  windows:
    name: Windows (${{ matrix.build_type }}, shared=${{ matrix.shared }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - build_type: Debug
            shared: OFF
          - build_type: Release
            shared: ON
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B out/build -A x64 -DAERO_BUILD_SHARED=${{ matrix.shared }} -DAERO_BUILD_TESTS=ON -DAERO_ENABLE_EXCEPTIONS=OFF -DAERO_ENABLE_RTTI=OFF -DAERO_WARNINGS_AS_ERRORS=ON -DAERO_ENABLE_D3D11_BACKEND=ON
      - name: Build
        shell: pwsh
        run: |
          cmd /c "cmake --build out/build --config ${{ matrix.build_type }} --parallel > out\msvc-build.log 2>&1"
          $buildExitCode = $LASTEXITCODE
          Get-Content out/msvc-build.log
          exit $buildExitCode
      - name: Upload MSVC build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-${{ matrix.build_type }}-shared-${{ matrix.shared }}-build-log
          path: out/msvc-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Test
        shell: pwsh
        run: |
          cmd /c "ctest --test-dir out/build -C ${{ matrix.build_type }} --output-on-failure > out\msvc-${{ matrix.build_type }}-test.log 2>&1"
          $testExitCode = $LASTEXITCODE
          Get-Content out/msvc-${{ matrix.build_type }}-test.log
          exit $testExitCode
      - name: Upload MSVC test log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-${{ matrix.build_type }}-shared-${{ matrix.shared }}-test-log
          path: out/msvc-${{ matrix.build_type }}-test.log
          if-no-files-found: ignore
          retention-days: 7
      - name: D3D11 WARP pixel and swap-chain conformance
        run: ctest --test-dir out/build -C ${{ matrix.build_type }} -R "AeroD3D11.*Tests" -V
