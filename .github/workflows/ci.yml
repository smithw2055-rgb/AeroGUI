name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "agent/**"]
    paths-ignore:
      - .github/workflows/ci.yml
      - .github/workflows/apply-implementation-metadata-migration.yml
      - .github/scripts/migrate_implementation_metadata.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    if: github.head_ref != 'agent/developer-friendly-metadata-api' && github.ref_name != 'agent/developer-friendly-metadata-api'
    name: Linux C++17
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Configure
        run: |
          cmake -S . -B out/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAERO_BUILD_SHARED=OFF \
            -DAERO_BUILD_TESTS=ON \
            -DAERO_BUILD_SAMPLES=ON \
            -DAERO_BUILD_TOOLS=ON \
            -DAERO_ENABLE_EXCEPTIONS=OFF \
            -DAERO_ENABLE_RTTI=OFF \
            -DAERO_WARNINGS_AS_ERRORS=ON \
            -DAERO_ENABLE_D3D11_BACKEND=OFF \
            -DAERO_ENABLE_WGL_SURFACE=OFF \
            -DAERO_ENABLE_GLX_SURFACE=OFF \
            -DAERO_ENABLE_SOKOL_BACKEND=OFF

      - name: Build
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          cmake --build out/ci --parallel 2 2>&1 | tee out/ci/build.log

      - name: Upload build diagnostics
        if: steps.build.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: aero-build-log
          path: out/ci/build.log
          if-no-files-found: error

      - name: Fail failed build
        if: steps.build.outcome == 'failure'
        run: exit 1

      - name: Test
        run: ctest --test-dir out/ci --output-on-failure --timeout 120
