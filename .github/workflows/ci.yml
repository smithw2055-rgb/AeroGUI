name: C++17 CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4
      - name: Select compiler
        shell: bash
        run: |
          if [[ "${{ matrix.compiler }}" == "gcc" ]]; then
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          else
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B out/build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DAERO_BUILD_TESTS=ON -DAERO_ENABLE_EXCEPTIONS=OFF -DAERO_ENABLE_RTTI=OFF -DAERO_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          cmake --build out/build --parallel 2>&1 | tee "out/${{ matrix.compiler }}-build.log"
      - name: Upload Linux build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.compiler }}-build-log
          path: out/${{ matrix.compiler }}-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Test
        run: ctest --test-dir out/build --output-on-failure

  windows:
    name: Windows (MSVC C++17)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B out/build -A x64 -DAERO_BUILD_TESTS=ON -DAERO_ENABLE_EXCEPTIONS=OFF -DAERO_ENABLE_RTTI=OFF -DAERO_WARNINGS_AS_ERRORS=ON
      - name: Build
        shell: pwsh
        run: |
          cmd /c "cmake --build out/build --config Debug --parallel > out\msvc-build.log 2>&1"
          $buildExitCode = $LASTEXITCODE
          Get-Content out/msvc-build.log
          exit $buildExitCode
      - name: Upload MSVC build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: msvc-build-log
          path: out/msvc-build.log
          if-no-files-found: error
          retention-days: 7
      - name: Test
        run: ctest --test-dir out/build -C Debug --output-on-failure
