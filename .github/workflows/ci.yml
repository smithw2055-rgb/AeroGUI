name: Apply test removal

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'codex/xaml-kernel-refactor'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: codex/xaml-kernel-refactor
          fetch-depth: 0
          show-progress: false

      - name: Apply build and product migration
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          cmake = Path('CMakeLists.txt')
          text = cmake.read_text(encoding='utf-8')
          text = text.replace('option(AERO_BUILD_TESTS "Build AeroGUI unit tests" ON)\n', '')
          text = text.replace(
              '    # Keep test executables beside the DLLs on multi-config Windows builds so\n'
              '    # CTest exercises the actual shared artifacts without PATH mutations.\n', '')
          text = re.sub(
              r'set\(AERO_TEXT_TEST_(?:FONT|CJK_FONT|ARABIC_FONT) "" CACHE FILEPATH\n'
              r'    "[^"]*"\)\n', '', text)
          text = re.sub(
              r'    if\(AERO_TEXT_TEST_(?:FONT|CJK_FONT|ARABIC_FONT) STREQUAL "" AND\n'
              r'.*?    endif\(\)\n\n', '', text, flags=re.S)
          text = re.sub(
              r'\nif\(AERO_BUILD_TESTS\)\n'
              r'    enable_testing\(\)\n'
              r'    add_subdirectory\(tests\)\n'
              r'endif\(\)\n', '\n', text, count=1)
          cmake.write_text(text, encoding='utf-8')

          sample = Path('samples/ControlGallery/CMakeLists.txt')
          text = sample.read_text(encoding='utf-8')
          marker = '\nif(AERO_BUILD_TESTS)\n'
          if marker in text:
              text = text.split(marker, 1)[0].rstrip() + '\n'
          sample.write_text(text, encoding='utf-8')

          presets = Path('CMakePresets.json')
          data = json.loads(presets.read_text(encoding='utf-8'))
          for preset in data.get('configurePresets', []):
              preset.get('cacheVariables', {}).pop('AERO_BUILD_TESTS', None)
          data.pop('testPresets', None)
          presets.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')

          checks = Path('cmake/CheckArchitecture.cmake')
          text = checks.read_text(encoding='utf-8')
          text = text.replace(
              '    "${AERO_SOURCE_DIR}/tests/*.cpp"\n'
              '    "${AERO_SOURCE_DIR}/tests/*.inc"\n', '')
          checks.write_text(text, encoding='utf-8')

          add_xaml = Path('cmake/AeroAddXaml.cmake')
          text = add_xaml.read_text(encoding='utf-8')
          text = text.replace('Aero::Markup::XamlSchemaManifest', 'Aero::Markup::SchemaManifest')
          text = text.replace('bundle.XamlSchema()', 'bundle.Schema()')
          add_xaml.write_text(text, encoding='utf-8')

          runtime = Path('src/RuntimeHost.cpp')
          text = runtime.read_text(encoding='utf-8')
          text = text.replace(
              'schema.Finalize(\n            modules, SchemaBundleServices{allocator});',
              'schema.Finalize(\n            SchemaBundleServices{allocator});')
          text = text.replace(
              'status = schemaBundle->Finalize(\n                modules,\n                SchemaBundleServices{allocator});',
              'status = schemaBundle->Finalize(\n                SchemaBundleServices{allocator});')
          runtime.write_text(text, encoding='utf-8')

          badge_h = Path('samples/ControlGallery/StatusBadge.hpp')
          text = badge_h.read_text(encoding='utf-8')
          text = text.replace('#include <Aero/Metadata.hpp>\n', '')
          badge_h.write_text(text, encoding='utf-8')

          badge_cpp = Path('samples/ControlGallery/StatusBadge.cpp')
          text = badge_cpp.read_text(encoding='utf-8')
          if '#include <Aero/Metadata.hpp>' not in text:
              text = text.replace(
                  '#include "StatusBadge.hpp"\n',
                  '#include "StatusBadge.hpp"\n\n#include <Aero/Metadata.hpp>\n')
          badge_cpp.write_text(text, encoding='utf-8')

          gallery_h = Path('samples/ControlGallery/GalleryRuntime.hpp')
          text = gallery_h.read_text(encoding='utf-8')
          text = text.replace('#include <Aero/Markup/Runtime/XamlObjectWriter.hpp>\n', '')
          gallery_h.write_text(text, encoding='utf-8')

          gallery = Path('samples/ControlGallery/GalleryRuntime.cpp')
          text = gallery.read_text(encoding='utf-8')
          text = text.replace('AERO_TYPED_META_NAMED(', 'AERO_DECLARE_TYPE_NAMED(')
          text = text.replace('Ref<RuntimeView> view;', 'Ref<View> view;\n    UiDocument document;')
          text = text.replace('Result<Ref<RuntimeView>> created =', 'Result<Ref<View>> created =')
          text = text.replace(
              '''            Result<Ref<Object>> loaded =
                Runtime().ParseXaml({
                    reinterpret_cast<const char*>(
                        source.data()),
                    static_cast<std::uint32_t>(
                        source.size())},
                    {},
                    &diagnostics);
            if (!loaded) return loaded.GetStatus();
            root = std::move(loaded).Value();
            return {};
''',
              '''            Result<UiDocument> loaded =
                Runtime().Parse({
                    reinterpret_cast<const char*>(
                        source.data()),
                    static_cast<std::uint32_t>(
                        source.size())},
                    {},
                    &diagnostics);
            if (!loaded) return loaded.GetStatus();
            document = std::move(loaded).Value();
            root = document.Root();
            return {};
''')
          text = text.replace(
              '''        Result<Ref<Object>> loaded =
            Runtime().LoadCompiledXaml({
                source.data(),
                static_cast<std::uint32_t>(
                    source.size())});
        if (!loaded) return loaded.GetStatus();
        root = std::move(loaded).Value();
        return {};
''',
              '''        Result<UiDocument> loaded =
            Runtime().LoadCompiled({
                source.data(),
                static_cast<std::uint32_t>(
                    source.size())});
        if (!loaded) return loaded.GetStatus();
        document = std::move(loaded).Value();
        root = document.Root();
        return {};
''')
          text = text.replace(
              'status = state->Runtime().Mount({900.0, 640.0});',
              'status = state->Runtime().Mount(\n        std::move(state->document), {900.0, 640.0});')
          gallery.write_text(text, encoding='utf-8')

          Path('.github/workflows/ci.yml').write_text('''name: CI

