name: Remove obsolete test suite

on:
  push:
    branches: [agent/remove-all-tests]

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: codex/xaml-kernel-refactor
          fetch-depth: 0
          show-progress: false

      - name: Remove tests and test-only build surface
        shell: bash
        run: |
          rm -rf tests
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{path}: expected one match, found {count}: {old!r}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          cmake = Path("CMakeLists.txt")
          text = cmake.read_text(encoding="utf-8")
          text = text.replace(
              'option(AERO_BUILD_TESTS "Build AeroGUI unit tests" ON)\n',
              '')
          text = text.replace(
              '    # Keep test executables beside the DLLs on multi-config Windows builds so\n'
              '    # CTest exercises the actual shared artifacts without PATH mutations.\n',
              '')
          for name in (
              "AERO_TEXT_TEST_FONT",
              "AERO_TEXT_TEST_CJK_FONT",
              "AERO_TEXT_TEST_ARABIC_FONT",
          ):
              text, count = re.subn(
                  rf'set\({name} "" CACHE FILEPATH\n'
                  rf'    "[^"]*"\)\n',
                  '',
                  text,
                  count=1)
              if count != 1:
                  raise SystemExit(f"{cmake}: could not remove {name}")
          for name in (
              "AERO_TEXT_TEST_FONT",
              "AERO_TEXT_TEST_CJK_FONT",
              "AERO_TEXT_TEST_ARABIC_FONT",
          ):
              text = re.sub(
                  rf'    if\({name} STREQUAL "" AND\n'
                  rf'.*?    endif\(\)\n\n',
                  '',
                  text,
                  count=1,
                  flags=re.S)
          test_block = (
              'if(AERO_BUILD_TESTS)\n'
              '    enable_testing()\n'
              '    add_subdirectory(tests)\n'
              'endif()\n\n')
          if test_block not in text:
              raise SystemExit(f"{cmake}: test block not found")
          text = text.replace(test_block, '', 1)
          cmake.write_text(text, encoding="utf-8")

          sample = Path("samples/ControlGallery/CMakeLists.txt")
          text = sample.read_text(encoding="utf-8")
          marker = "\nif(AERO_BUILD_TESTS)\n"
          if marker not in text:
              raise SystemExit(f"{sample}: test block not found")
          text = text.split(marker, 1)[0].rstrip() + "\n"
          sample.write_text(text, encoding="utf-8")

          presets = Path("CMakePresets.json")
          data = json.loads(presets.read_text(encoding="utf-8"))
          for preset in data.get("configurePresets", []):
              preset.get("cacheVariables", {}).pop("AERO_BUILD_TESTS", None)
          data.pop("testPresets", None)
          presets.write_text(
              json.dumps(data, indent=2) + "\n",
              encoding="utf-8")

          checks = Path("cmake/CheckArchitecture.cmake")
          text = checks.read_text(encoding="utf-8")
          text = text.replace(
              '    "${AERO_SOURCE_DIR}/tests/*.cpp"\n'
              '    "${AERO_SOURCE_DIR}/tests/*.inc"\n',
              '')
          checks.write_text(text, encoding="utf-8")

          workflow = Path(".github/workflows/ci.yml")
          text = workflow.read_text(encoding="utf-8")
          text = text.replace(
              '            -DAERO_BUILD_TESTS=ON \\\n',
              '')
          source_snapshot = re.compile(
              r'\n      - name: Upload source snapshot\n.*?'
              r'(?=\n      - name: Fail failed build)',
              re.S)
          text, count = source_snapshot.subn('', text, count=1)
          if count != 1:
              raise SystemExit(f"{workflow}: source snapshot step not found")
          test_step = re.compile(
              r'\n      - name: Test\n.*\Z',
              re.S)
          text, count = test_step.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f"{workflow}: test step not found")
          configure_marker = "\n      - name: Configure\n"
          architecture_step = (
              "\n      - name: Check architecture\n"
              "        run: cmake \"-DAERO_SOURCE_DIR=${{ github.workspace }}\" "
              "-P cmake/CheckArchitecture.cmake\n")
          if configure_marker not in text:
              raise SystemExit(f"{workflow}: configure step not found")
          text = text.replace(
              configure_marker,
              architecture_step + configure_marker,
              1)
          workflow.write_text(text, encoding="utf-8")

          replace_once(
              Path("src/RuntimeHost.cpp"),
              "schema.Finalize(\n            modules, SchemaBundleServices{allocator});",
              "schema.Finalize(\n            SchemaBundleServices{allocator});")

          add_xaml = Path("cmake/AeroAddXaml.cmake")
          text = add_xaml.read_text(encoding="utf-8")
          for old, new in (
              ("Aero::Markup::XamlSchemaManifest", "Aero::Markup::SchemaManifest"),
              ("bundle.XamlSchema()", "bundle.Schema()"),
          ):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{add_xaml}: expected one {old}, found {count}")
              text = text.replace(old, new, 1)
          add_xaml.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Check architecture
        run: cmake "-DAERO_SOURCE_DIR=${GITHUB_WORKSPACE}" -P cmake/CheckArchitecture.cmake

      - name: Configure
        run: |
          cmake -S . -B out/remove-tests -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAERO_BUILD_SHARED=OFF \
            -DAERO_BUILD_SAMPLES=ON \
            -DAERO_BUILD_TOOLS=ON \
            -DAERO_ENABLE_EXCEPTIONS=OFF \
            -DAERO_ENABLE_RTTI=OFF \
            -DAERO_WARNINGS_AS_ERRORS=ON \
            -DAERO_ENABLE_D3D11_BACKEND=OFF \
            -DAERO_ENABLE_WGL_SURFACE=OFF \
            -DAERO_ENABLE_GLX_SURFACE=OFF \
            -DAERO_ENABLE_SOKOL_BACKEND=OFF

      - name: Build
        run: cmake --build out/remove-tests --parallel 2 -- -k 0

      - name: Commit removal
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove obsolete test suite"
          git push origin HEAD:codex/xaml-kernel-refactor
