name: ControlGallery Source Export

on:
  pull_request:
    branches:
      - codex/local-no-samples-tests
  push:
    branches:
      - agent/control-gallery-xaml-alignment
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          show-progress: false
          submodules: recursive
      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: control-gallery-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
