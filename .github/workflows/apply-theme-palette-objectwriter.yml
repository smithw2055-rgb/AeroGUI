name: Apply theme palette object-writer migration

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/patches/apply-theme-palette-objectwriter.py"
      - ".github/workflows/apply-theme-palette-objectwriter.yml"

permissions:
  contents: write

concurrency:
  group: theme-palette-objectwriter-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  apply-build-test:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          show-progress: false

      - name: Apply migration
        run: python3 .github/patches/apply-theme-palette-objectwriter.py

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Configure
        run: |
          cmake -S . -B out/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAERO_BUILD_SHARED=OFF \
            -DAERO_BUILD_TESTS=ON \
            -DAERO_BUILD_SAMPLES=ON \
            -DAERO_BUILD_TOOLS=ON \
            -DAERO_ENABLE_EXCEPTIONS=OFF \
            -DAERO_ENABLE_RTTI=OFF \
            -DAERO_WARNINGS_AS_ERRORS=ON \
            -DAERO_ENABLE_D3D11_BACKEND=OFF \
            -DAERO_ENABLE_WGL_SURFACE=OFF \
            -DAERO_ENABLE_GLX_SURFACE=OFF \
            -DAERO_ENABLE_SOKOL_BACKEND=OFF

      - name: Build
        run: cmake --build out/ci --parallel 2

      - name: Test
        run: ctest --test-dir out/ci --output-on-failure --timeout 120

      - name: Commit verified migration
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          rm -f .github/patches/apply-theme-palette-objectwriter.py
          rm -f .github/workflows/apply-theme-palette-objectwriter.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load built-in theme palettes through XamlObjectWriter"
          git push origin "HEAD:${HEAD_BRANCH}"
