name: Apply markup generic resource refactor

on:
  push:
    branches: [agent/markup-generic-resource-pipeline]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-build-test:
    if: github.actor != 'github-actions[bot]' && (github.event_name == 'push' || github.head_ref == 'agent/markup-generic-resource-pipeline')
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: agent/markup-generic-resource-pipeline

      - name: Apply refactor
        run: |
          git mv include/Aero/Markup/XamlThemeResources.hpp src/markup/XamlThemeResources.hpp
          git apply --recount --whitespace=error-all .github/patches/markup-generic-resource.patch

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ninja-build

      - name: Configure
        run: |
          cmake -S . -B out/ci -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DAERO_BUILD_SHARED=OFF \
            -DAERO_BUILD_TESTS=ON \
            -DAERO_BUILD_SAMPLES=ON \
            -DAERO_BUILD_TOOLS=ON \
            -DAERO_ENABLE_EXCEPTIONS=OFF \
            -DAERO_ENABLE_RTTI=OFF \
            -DAERO_WARNINGS_AS_ERRORS=ON \
            -DAERO_ENABLE_D3D11_BACKEND=OFF \
            -DAERO_ENABLE_WGL_SURFACE=OFF \
            -DAERO_ENABLE_GLX_SURFACE=OFF \
            -DAERO_ENABLE_SOKOL_BACKEND=OFF

      - name: Build
        run: cmake --build out/ci --parallel 2

      - name: Test
        run: ctest --test-dir out/ci --output-on-failure --timeout 120

      - name: Commit verified refactor
        run: |
          rm .github/patches/markup-generic-resource.patch
          rm .github/workflows/apply-markup-generic-resource.yml
          rmdir .github/patches 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "refactor(markup): unify resources on Core::Value"
          git push origin HEAD:agent/markup-generic-resource-pipeline
