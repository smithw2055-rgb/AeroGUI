name: Apply full migration

on:
  push:
    branches:
      - agent/unified-metadata-control-extensibility
    paths:
      - .github/workflows/apply-full-migration.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Reconstruct migration patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/migration/part00.b64 \
              .github/migration/part01.b64 \
              .github/migration/part02.b64 \
              .github/migration/part03.b64 \
              .github/migration/part04.b64 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/full-migration.patch
          test -s /tmp/full-migration.patch

      - name: Validate and apply migration
        shell: bash
        run: |
          set -euo pipefail
          git apply --check /tmp/full-migration.patch
          git apply --index /tmp/full-migration.patch
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Migration patch produced no changes" >&2
            exit 1
          fi

      - name: Commit migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Complete presentation hierarchy migration"
          git push origin "HEAD:${GITHUB_REF_NAME}"
