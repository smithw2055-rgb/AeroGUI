name: Apply render backend refactor

on:
  pull_request:
    branches:
      - codex/m3-interactive-controls-text-opengl

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply refactor patch
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          parts=(.github/refactor-patch/part*)
          if (( ${#parts[@]} == 0 )); then
            echo "Refactor patch is already applied."
            exit 0
          fi

          cat "${parts[@]}" | base64 --decode | gzip --decompress > /tmp/render-refactor.patch
          git apply --index /tmp/render-refactor.patch
          rm -rf .github/refactor-patch .refactor-probe
          git add -A

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refactor render backend boundaries"
          git push origin "HEAD:${{ github.head_ref }}"
