name: Apply enum validation migration

on:
  push:
    branches:
      - agent/developer-friendly-metadata-api
    paths:
      - .github/workflows/apply-enum-validation-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/developer-friendly-metadata-api
          fetch-depth: 0

      - name: Centralize enum value validation
        shell: bash
        run: |
          echo '' | base64 --decode | gzip --decompress > /tmp/enum_validation_cleanup.py
          python3 /tmp/enum_validation_cleanup.py

      - name: Commit migration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/core/property/DependencyProperty.cpp \
            src/controls/Metadata.cpp \
            src/presentation/Metadata.cpp
          git diff --cached --quiet && exit 0
          git commit -m "refactor: centralize enum property validation [skip ci]"
          git push origin HEAD:agent/developer-friendly-metadata-api
