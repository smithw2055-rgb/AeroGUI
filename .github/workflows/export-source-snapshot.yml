name: Export source snapshot

on:
  pull_request:
    branches:
      - codex/m3-interactive-controls-text-opengl

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload source tree
        uses: actions/upload-artifact@v4
        with:
          name: aerogui-source-tree
          include-hidden-files: true
          path: |
            .
            !.git
