name: Apply render backend refactor

on:
  pull_request:
    branches:
      - codex/m3-interactive-controls-text-opengl

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout implementation branch
        uses: actions/checkout@v4
        with:
          ref: agent/render-backend-refactor
          fetch-depth: 0

      - name: Reassemble and apply refactor
        shell: bash
        run: |
          set -euo pipefail
          cat .github/refactor-payload/*.part > /tmp/refactor.patch.gz.b64
          base64 --decode /tmp/refactor.patch.gz.b64 > /tmp/refactor.patch.gz
          gzip -dc /tmp/refactor.patch.gz > /tmp/refactor.patch
          echo "392d0d6c7052e47f7525bb72b20cebaea3de9131e0cd225ca34fc7870d5528d8  /tmp/refactor.patch" | sha256sum -c -
          git apply --index --whitespace=error --exclude=.github/workflows/export-source-snapshot.yml /tmp/refactor.patch
          rm -rf .github/refactor-payload
          rm -f .github/workflows/export-source-snapshot.yml
          git add -A

      - name: Configure strict Linux build
        run: cmake -S . -B build -DAERO_BUILD_TESTS=ON -DAERO_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel 2

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aerogui-refactor-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Refactor render backend boundaries"
          git push origin HEAD:agent/render-backend-refactor
